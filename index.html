<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart SIP Calculator</title>
  <!-- 1. Official Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 2. AdsGram SDK (Replace with your ad network script if using RichAds/Monetag) -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
      padding: 20px;
      margin: 0;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #f4f4f5);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 14px; margin-bottom: 6px; opacity: 0.85; }
    input {
      width: 100%; padding: 10px; font-size: 16px; border-radius: 8px;
      border: 1px solid #ccc; box-sizing: border-box; margin-bottom: 14px;
    }
    button {
      width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
      border: none; border-radius: 10px; cursor: pointer;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    .result { font-size: 22px; font-weight: 700; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>SIP Wealth Calculator</h2>
  <div class="card">
    <label>Monthly Investment (₹)</label>
    <input type="number" id="monthly" value="5000" />

    <label>Expected Annual Return (%)</label>
    <input type="number" id="rate" value="12" />

    <label>Time Period (Years)</label>
    <input type="number" id="years" value="10" />

    <button onclick="calculateWithAd()">Calculate Returns</button>
  </div>

  <div class="card" id="outputCard" style="display:none;">
    <div>Estimated Total Value</div>
    <div class="result" id="totalValue">₹0</div>
    <div style="font-size:13px; margin-top:6px; opacity:0.8;" id="breakdown"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Initialize AdsGram with your Block ID from partner.adsgram.ai
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_BLOCK_ID" }) : null;

    function showCalculation() {
      const P = parseFloat(document.getElementById("monthly").value) || 0;
      const annualRate = parseFloat(document.getElementById("rate").value) || 0;
      const years = parseFloat(document.getElementById("years").value) || 0;

      const r = annualRate / 12 / 100;
      const n = years * 12;
      const futureValue = r > 0 ? P * ((Math.pow(1 + r, n) - 1) / r) * (1 + r) : P * n;
      const invested = P * n;

      document.getElementById("outputCard").style.display = "block";
      document.getElementById("totalValue").innerText = "₹" + Math.round(futureValue).toLocaleString("en-IN");
      document.getElementById("breakdown").innerText =
        `Invested: ₹${invested.toLocaleString("en-IN")} | Wealth Gained: ₹${Math.round(futureValue - invested).toLocaleString("en-IN")}`;
    }

    function calculateWithAd() {
      // Haptic feedback for a native app feel
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");

      if (AdController) {
        AdController.show().then(() => {
          showCalculation(); // User watched/closed the ad
        }).catch(() => {
          showCalculation(); // Fallback if no ad is available so UX never breaks
        });
      } else {
        showCalculation();
      }
    }
  </script>
</body>
</html>
